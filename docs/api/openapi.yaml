openapi: 3.1.0
info:
  title: WANEES API
  version: 1.0.0
  summary: Visitor, live-state, itinerary and admin contracts for the WANEES backend.
  description: |
    Contract for the WANEES backend (Next.js route handlers), derived from the
    current route handlers and the Zod schemas in `app/lib/api-contracts.ts`.

    ## Envelope
    Every non-legacy endpoint in this document uses one of two envelopes:

    * Success:  `{ "data": <payload>, "meta": { "contractVersion": "v1", "requestId": "..." } }`
    * Error:    `{ "error": { "code": "<ApiErrorCode>", "message": "<human text>", "details": <optional> },
                  "meta": { "contractVersion": "v1", "requestId": "..." } }`

    `meta.requestId` echoes a caller-supplied `x-request-id` when it matches
    `^[a-zA-Z0-9._:-]{1,120}$`; otherwise the server generates a UUID. The same value is
    returned in the `x-request-id` response header.

    ## Versioning
    Path-versioned (`/api/v1/...`). `meta.contractVersion` is always `v1`. Additive fields may
    appear at any time inside `data`; clients must ignore unknown fields. Breaking changes ship
    under a new path version with a deprecation window of at least one release cycle.

    ## Legacy surface
    `/api/events/{eventSlug}`, `/api/zones`, `/api/ops`, `/api/tick` and `/api/admin/broadcast`
    predate the v1 envelope and are marked `deprecated`. They stay for the local demo only.

    ## Cross-site requests
    A POST, PUT, PATCH or DELETE under `/api/` whose `Origin` is another site's (or whose
    `Sec-Fetch-Site` is `cross-site`) gets 403 `ORIGIN_FORBIDDEN` before any route runs. Native apps,
    kiosks and webhooks send no Origin and are not affected; a deployment may trust more origins.

    ## Units and time
    * Money in `*Cents` fields is integer minor units (SAR cents). Money in engine payloads
      (`price`, `total_cost`) is whole SAR as a float.
    * `*Minute` fields are minutes after local midnight (0-1440). Engine `start`/`end` values are
      also minute offsets from local midnight.
    * All timestamps are ISO-8601 with an offset (`Z` or `+03:00`).
    * `clock` explains which minute the engine considers "now" and whether the venue is open.
  contact:
    name: WANEES backend
    url: https://github.com/abc7pq/wanees_platform
tags:
  - name: Session
    description: Visitor session lifecycle and identity.
  - name: Route
    description: Deterministic itinerary generation and replanning.
  - name: Assistant
    description: Conversational assistant bound to a visitor session.
  - name: Live
    description: Crowd levels and event updates used for replanning.
  - name: Catalog
    description: Published venue catalog, zones and map geometry.
  - name: Incentive
    description: Visitor-facing incentives surfaced in the replan alert.
  - name: Telemetry
    description: Product metrics per visitor session.
  - name: Organizer
    description: Organizer endpoints served by the admin app (port 3200).
  - name: Platform
    description: Health, operations and internal admin.
servers:
  - url: http://127.0.0.1:3100
    description: Local visitor app (Next.js, `wanees-visitor-web`).
  - url: http://127.0.0.1:3200
    description: Local admin app (`wanees-admin-web`); only the admin endpoints exist here.
security: []
paths:
  /api/v1/events/{eventSlug}/session:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Session]
      operationId: createVisitorSession
      summary: Start a visitor session
      description: |
        Creates a visitor session pinned to the event's published catalog version.
        Rate limit: **20 requests/minute** per `(ip, token)` pair, scope `session:create:<slug>`.
        Returns `retry-after` seconds on 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            set-cookie:
              description: Present only when `clientType` is `web` and the browser-cookie feature flag is on.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/CreateSessionResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Session]
      operationId: getVisitorSession
      summary: Read the current visitor session
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Session found.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [sessionId, eventSlug, eventName, catalogVersionId, locale, expiresAt, preferences]
                    properties:
                      sessionId:
                        type: string
                      eventSlug:
                        type: string
                      eventName:
                        type: string
                      catalogVersionId:
                        type: string
                      locale:
                        $ref: '#/components/schemas/Locale'
                      expiresAt:
                        type: string
                        format: date-time
                      preferences:
                        oneOf:
                          - $ref: '#/components/schemas/Preferences'
                          - type: 'null'
                      channel:
                        type: string
                        enum: [web, call, kiosk]
                      remembered:
                        type: boolean
                        description: The visitor ticked «تذكّرني»; the visit is linked to an anonymous guest profile.
                      visitCount:
                        type: integer
                        minimum: 0
                        description: Visits of the remembered guest, this one included; 0 when not remembered.
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Session]
      operationId: deleteVisitorSession
      summary: End the visitor session
      description: Idempotent. Deletes the session row and clears the visitor cookie.
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Session deleted (also returned when no session existed).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: boolean
                        const: true
                  meta:
                    $ref: '#/components/schemas/Meta'
    patch:
      tags: [Session]
      operationId: patchVisitorSession
      summary: Change a visit preference
      description: |
        The reply language and «تذكّرني للزيارة الجاية» chosen in «أنا»; at least one is required. Other
        preferences come from the visitor's own words in the chat.
        `rememberMe: true` creates an anonymous guest profile (no name or phone) and sets the
        `wanees_guest` HttpOnly cookie; this visit counts as the first and its planned activities as seen.
        `rememberMe: false` deletes the profile and clears the cookie; the visit goes on.
        Not offered in the rehearsal, at a kiosk, or for a registered visitor (409 REMEMBER_UNAVAILABLE).
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                replyLanguage:
                  type: string
                  enum: [ar, en, fr, ur]
                rememberMe:
                  type: boolean
      responses:
        '200':
          description: Preference saved. Only the fields that were sent come back.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    properties:
                      replyLanguage:
                        type: string
                        enum: [ar, en, fr, ur]
                      remembered:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: Remembering is not offered for this visit (REMEMBER_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventSlug}/link:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Session]
      operationId: createLinkCode
      summary: A code to show this visit on a venue screen («اعرض مسارك على شاشة»)
      description: |
        A 6-character code (no 0/O/1/I/L) and its QR, valid 10 minutes and usable once. A screen that
        redeems it may read this visit's plan, nothing else, until it is idle for 60 seconds, says
        «انتهيت», or the visitor revokes it. Making a new code cancels the previous unused one. The code
        is stored hashed with the event id. Only a web visit can make one; rate limit 10 per 10 minutes.
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '201':
          description: Code created.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [code, expiresAt, scope, idleSeconds, url, qrSvg]
                    properties:
                      code: { type: string, pattern: '^[2-9A-HJKMNP-Z]{6}$' }
                      expiresAt: { type: string, format: date-time }
                      scope: { type: string, enum: [read] }
                      idleSeconds: { type: integer, const: 60 }
                      url: { type: string, description: The screen page with the code in the fragment. }
                      qrSvg: { type: string, description: An SVG QR of url. }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: Not a phone's web visit, or the rehearsal (LINK_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Session]
      operationId: getLinkStatus
      summary: Whether a screen has linked to this visit
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: The latest code's state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [none, pending, expired, active, idle, revoked] }
                      expiresAt: { type: string, format: date-time }
                      scope: { type: string, enum: [read] }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
    delete:
      tags: [Session]
      operationId: revokeLinks
      summary: Stop every code and screen of this visit («أوقف الربط»)
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked: { type: integer, minimum: 0 }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /api/v1/events/{eventSlug}/link/redeem:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Session]
      operationId: redeemLinkCode
      summary: A screen enters a visitor's code
      description: |
        Works once, within 10 minutes, at the code's own event, and never for the session that made it.
        A wrong, used, expired or revoked code all answer 404 LINK_CODE_INVALID. Spaces, dashes,
        lower case and Arabic digits are accepted. Rate limit 10/minute per screen, 30 per address.
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 32 }
      responses:
        '201':
          description: Linked, read-only.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [grantId, scope, idleSeconds]
                    properties:
                      grantId: { type: string }
                      scope: { type: string, enum: [read] }
                      idleSeconds: { type: integer, const: 60 }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          description: The code is not valid here (LINK_CODE_INVALID), or the screen's session is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/events/{eventSlug}/link/{grantId}:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
      - name: grantId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Session]
      operationId: readLinkedVisit
      summary: The linked visit's plan, for the screen that redeemed the code
      description: Stops only (names, zones, times, walking minutes). No chat, preferences or ids. Each read keeps the link alive for another 60 seconds.
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [scope, stops]
                    properties:
                      scope: { type: string, enum: [read] }
                      stops:
                        type: array
                        items:
                          type: object
                          required: [activityId, name, zone, zoneName, startsAt, endsAt, walkMin]
                          properties:
                            activityId: { type: string }
                            name: { type: string }
                            zone: { type: string }
                            zoneName: { type: string }
                            startsAt: { type: string, format: date-time }
                            endsAt: { type: string, format: date-time }
                            walkMin: { type: integer, minimum: 0 }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '410':
          description: "The link ended (idle, «انتهيت», revoked, the visit ended), or it is not this screen's (LINK_ENDED)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Session]
      operationId: endLinkedVisit
      summary: «انتهيت» on the screen
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [ended]
                    properties:
                      ended: { type: boolean, const: true }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '410':
          description: Not this screen's link (LINK_ENDED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventSlug}/visitor/otp/start:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Session]
      operationId: startVisitorOtp
      summary: Start optional visitor registration (send an SMS code)
      description: |
        Only used when `WANEES_FEATURE_VISITOR_REGISTRATION` is on. Validates the name, a Saudi mobile
        and consent to `VISITOR_CONSENT_VERSION`, then asks the SMS provider to send a code.
        Limits: 5 requests per 10 minutes per address. Per phone (counted from stored challenges,
        whatever the caller's IP): 60 seconds between codes, 3 per 10 minutes, 10 per day.
        Returns 404 when registration is off and 403 for a cross-site browser request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, consent, consentVersion]
              properties:
                name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 40, description: 'Saudi mobile such as 05XXXXXXXX; Arabic digits accepted.' }
                consent: { type: boolean, const: true }
                consentVersion: { type: string }
                clientType: { type: string, enum: [web, native], default: web }
      responses:
        '201':
          description: Code sent.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [challengeId, expiresAt, maskedPhone, resendAfterSeconds]
                    properties:
                      challengeId: { type: string }
                      expiresAt: { type: string, format: date-time }
                      maskedPhone: { type: string }
                      resendAfterSeconds: { type: integer }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The consent notice changed; reload and accept again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events/{eventSlug}/visitor/otp/verify:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Session]
      operationId: verifyVisitorOtp
      summary: Verify the SMS code and remember this device
      description: |
        Checks the code with the provider (max 5 attempts per challenge), creates or updates the visitor
        for the event's organization and sets the `wanees_visitor` HttpOnly cookie (web) or returns a
        `visitorToken` for native clients to send as `x-wanees-visitor-token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string }
                code: { type: string, description: '6 digits, ASCII or Arabic-Indic.' }
                rememberDevice: { type: boolean, default: true }
                clientType: { type: string, enum: [web, native], default: web }
      responses:
        '201':
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [verified, visitor, authMode]
                    properties:
                      verified: { type: boolean, const: true }
                      visitor:
                        $ref: '#/components/schemas/VisitorProfileSummary'
                      visitorToken: { type: string, description: Native clients only. }
                      authMode: { type: string, enum: [bearer, cookie] }
                      mergedGuest:
                        type: boolean
                        description: This browser's remembered guest profile was merged into the visitor (visit history, and taste when the visitor had none) and its cookie cleared, in the same transaction.
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Challenge not found; request a new code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The code was already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The code expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events/{eventSlug}/visitor/me:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Session]
      operationId: getRegisteredVisitor
      summary: Who this device remembers (welcome-back card)
      responses:
        '200':
          description: Always 200; visitor is null when no visitor is remembered.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [registrationRequired, visitor]
                    properties:
                      registrationRequired: { type: boolean }
                      visitor:
                        oneOf:
                          - $ref: '#/components/schemas/VisitorProfileSummary'
                          - type: 'null'
                      preferences:
                        description: Last saved preferences, when any.
                  meta:
                    $ref: '#/components/schemas/Meta'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Session]
      operationId: deleteRegisteredVisitor
      summary: Delete my data (visitor, devices, visits) and end this visit
      responses:
        '200':
          description: Deleted, or nothing to delete. Clears the device and session cookies.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events/{eventSlug}/visitor/logout:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Session]
      operationId: forgetVisitorDevice
      summary: Not me - forget this device and end the visit (the visitor record stays)
      responses:
        '200':
          description: Device forgotten.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [forgotten]
                    properties:
                      forgotten: { type: boolean, const: true }
                  meta:
                    $ref: '#/components/schemas/Meta'

  /api/v1/events/{eventSlug}/itinerary:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Route]
      operationId: createItinerary
      summary: Generate a deterministic itinerary
      description: |
        Builds a route from the session preferences (or the preferences in the body), persists it as
        the active itinerary, supersedes the previous active one and dismisses open proposals.

        Send an `Idempotency-Key` header to make the write replay-safe: the first accepted call
        creates the itinerary and stores its full response for 24 hours; a retry with the same key
        and body returns that stored response with `Idempotent-Replay: true` instead of creating
        another row. The same key with a different body returns `409 IDEMPOTENCY_KEY_REUSED`.

        Rate limit: **10 requests/minute** per session, scope `itinerary:create:<slug>:<sessionId>`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItineraryRequest'
      responses:
        '201':
          description: Itinerary generated and persisted, or replayed from the stored response for this key.
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            Catalog version mismatch or incomplete catalog (`CATALOG_VERSION_UNAVAILABLE`,
            `CATALOG_INCOMPLETE`), or idempotency conflict (`IDEMPOTENCY_KEY_REUSED`,
            `IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Route]
      operationId: getItinerary
      summary: Read the active itinerary
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Active itinerary, or `null` when the session has none.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/ItineraryResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: Catalog version mismatch (`CATALOG_VERSION_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventSlug}/itinerary/replan:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Route]
      operationId: replanItinerary
      summary: Replan against live state
      description: |
        Three-step optimistic flow:

        1. `decision=preview` computes a candidate. Returns `PROPOSED` with a `proposalId` and a
           `baseLiveRevision`, or `NO_CHANGE`, or `APPLIED` when the trigger is urgent (closure or
           cancellation), in which case the candidate becomes active immediately.
        2. `decision=accept` requires `proposalId`, `baseItineraryId` and `baseLiveRevision`.
           Returns `PROPOSAL_STALE` (409) if live state moved since the proposal was created, or if
           this session already accepted, dismissed or let the proposal expire. Only one of several
           concurrent accepts applies; the rest get 409. Another session's id gets 404.
        3. `decision=keep_current` requires `proposalId` and dismisses the proposal. It returns
           `PROPOSAL_STALE` (409) if this session already accepted, dismissed or let the proposal
           expire. Another session's id gets 404.

        Proposals expire after 15 minutes.

        Send an `Idempotency-Key` header to make the call replay-safe: the first response is stored
        for 24 hours and a retry with the same key and body replays it with `Idempotent-Replay: true`
        instead of creating a second proposal or applying a decision twice. The same key with a
        different body returns `409 IDEMPOTENCY_KEY_REUSED`.

        Rate limit: **12 requests/minute** per session, scope `replan:<slug>:<sessionId>`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplanRequest'
      responses:
        '200':
          description: Replan result, or a replay of the stored response for this key.
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/ReplanResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: |
            Invalid body (`INVALID_REQUEST`), including an `accept` without `proposalId`,
            `baseItineraryId` or `baseLiveRevision`; or `PROPOSAL_REQUIRED` for `keep_current`
            without `proposalId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          description: Session, active itinerary or proposal not found (`SESSION_NOT_FOUND`, `ITINERARY_NOT_FOUND`, `PROPOSAL_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Catalog mismatch, stale proposal (`PROPOSAL_STALE`), incomplete catalog, or idempotency
            conflict (`IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_REQUEST_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/events/{eventSlug}/incentives:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Incentive]
      operationId: listVisitorIncentives
      summary: List active incentives for the visitor
      description: |
        Lists currently active incentives eligible for the event's visitor session and plan.
        Each entry includes whether the session already requested the incentive.
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Active incentives for the session.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [incentive, claimed]
                      properties:
                        incentive:
                          $ref: '#/components/schemas/IncentiveDisplay'
                        claimed:
                          type: boolean
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          description: Session not found (`SESSION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Incentive]
      operationId: requestVisitorIncentive
      summary: Record an incentive request for the visitor
      description: Repeating the same request for the same session and active offer does not create another claim. The venue handles fulfillment.
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [incentiveId]
              properties:
                incentiveId: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Recorded incentive request.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [incentive, claimed]
                    properties:
                      incentive:
                        $ref: '#/components/schemas/IncentiveDisplay'
                      claimed: { const: true }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Invalid request.
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          description: Session not found.
        '409':
          description: Offer is no longer active or eligible for this visit.
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/events/{eventSlug}/directions:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Route]
      operationId: getVisitorDirections
      summary: Get walking directions within the published event
      description: Accepts catalog IDs for an activity, zone, service, gate, or landmark. A device with location permission can select an open origin node locally and send its ID as from.
      security:
        - visitorSession: []
        - visitorCookie: []
      parameters:
        - name: to
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: from
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: accessible
          in: query
          description: Step-free walkways only. Also on when the visitor said they have a wheelchair or a stroller.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        '200':
          description: Published route steps or a venue walking estimate when no connected graph route exists. An activity with an entrance node routes to that node.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [origin, target, arrival, demoRoute, mode, totalWalkMin, steps, pathNodes]
                    properties:
                      origin: { type: object }
                      target: { type: object }
                      arrival: { type: string, enum: [destination_node, zone] }
                      demoRoute: { type: boolean, description: True when the venue's live guidance is off (Venue.liveGuidance). }
                      mode: { type: string, enum: [graph, same_zone, estimate] }
                      totalWalkMin: { type: number, minimum: 0 }
                      accessibleOnly: { type: boolean, description: The route uses step-free walkways only. }
                      steps:
                        type: array
                        items: { type: object }
                      pathNodes:
                        type: array
                        items:
                          type: object
                          required: [x, y]
                          properties:
                            x: { type: number }
                            y: { type: number }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Missing or invalid destination.
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          description: Session, origin, or destination was not found.
        '409':
          description: Published catalog unavailable, requested point closed, or no step-free route (details.reason = no_accessible_route).
        '429':
          description: Too many directions requests.

  /api/v1/events/{eventSlug}/nearby:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Route]
      operationId: getNearbyPlaces
      summary: The nearest places of one kind («حولي»)
      description: |
        Up to three places of the category, nearest first by real walking minutes. Distances count from
        the device position when it is valid, else a position the visitor said in the chat (20 minutes),
        else the stop under way (stopZone), else the start point. The phone sends only the walkway node
        it snapped to: exact coordinates never leave the device. A rejected position is reported, not used.
        Rate limit: 60 requests/minute per session.
      security:
        - visitorSession: []
        - visitorCookie: []
      parameters:
        - name: category
          in: query
          required: true
          schema: { type: string, enum: [food, toilets, prayer, first_aid, info, gate, parking, shopping, shows, seating] }
        - name: nodeId
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: source
          in: query
          schema: { type: string, enum: [gps, kiosk, spoken] }
        - name: capturedAt
          in: query
          description: Required with nodeId. ISO 8601 with an offset.
          schema: { type: string, format: date-time }
        - name: accuracyM
          in: query
          schema: { type: number, minimum: 0, maximum: 5000 }
        - name: stopZone
          in: query
          schema: { type: string, maxLength: 120 }
        - name: lang
          in: query
          schema: { type: string, enum: [en] }
      responses:
        '200':
          description: Nearest places.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [category, label, calmInstead, origin, results]
                    properties:
                      category: { type: string }
                      label: { type: string }
                      calmInstead: { type: boolean, description: No seating is published; these are the calmest nearby places. }
                      origin:
                        type: object
                        nullable: true
                        properties:
                          zone: { type: string }
                          source: { type: string, enum: [gps, kiosk, spoken, stop, start_point, entrance, first_stop] }
                          name: { type: string }
                          phrase: { type: string }
                      positionRejected:
                        $ref: '#/components/schemas/PositionRejection'
                      results:
                        type: array
                        maxItems: 3
                        items:
                          type: object
                          required: [id, kind, name, zone, walkMin, sourceRef]
                          properties:
                            id: { type: string }
                            kind: { type: string, enum: [activity, location] }
                            name: { type: string }
                            zone: { type: string }
                            zoneName: { type: string }
                            walkMin: { type: number, minimum: 0 }
                            nodeId: { type: string, nullable: true }
                            sourceRef: { type: string }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: The session's catalog version is unavailable.
        '429':
          description: Too many requests.

  /api/v1/events/{eventSlug}/assistant:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Assistant]
      operationId: postAssistantMessage
      summary: Send a message to the visitor assistant
      description: |
        The assistant resolves intent and executes deterministic event tools. Itinerary changes
        (build, shorten, remove, add, swap) return a 15-minute proposal and never replace an
        existing active itinerary until the visitor accepts it through the replan endpoint.
        Conversation turns are redacted and expire after 24 hours.
        When the request cannot be handled it can open a handoff record (`handoff.status = OPEN`).
        Rate limit: **20 requests/minute** per session (LLM path only when the adapter flag is on).
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Send exactly one of `message` or `action`.
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 500
                action:
                  $ref: '#/components/schemas/A2uiActionMessage'
                position:
                  $ref: '#/components/schemas/VisitorPosition'
                language:
                  type: string
                  enum: [ar, en, fr, ur]
                  description: A reply language the visitor picked on the screen; otherwise the reply follows their words.
                linkGrantId:
                  type: string
                  maxLength: 64
                  description: |
                    A kiosk's redeemed phone link. Questions about the plan («وش محطتي الجاية؟») are answered from the
                    phone's visit with `linked.scope = read`; a change is refused the same way; 410 LINK_ENDED when
                    the link is over. Other questions use the kiosk's own visit.
                channel:
                  type: string
                  enum: [text, voice, call]
                  description: |
                    `text` (default) and `voice` get a personalised, grounding-checked reply.
                    `call` is used by the live voice call tool: the reply is the engine draft and
                    the response adds `facts`, the only facts the realtime voice may speak.
      responses:
        '200':
          description: Assistant reply.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/AssistantResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Assistant]
      operationId: getAssistantHistory
      summary: Read conversation history
      description: Returns up to 50 unexpired turns, oldest first.
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Conversation turns.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ConversationTurn'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /api/v1/events/{eventSlug}/assistant/call:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    post:
      tags: [Assistant]
      operationId: startAssistantCall
      summary: Start a live voice call with the visitor assistant
      description: |
        Builds personal call instructions from the session (visitor brief, plan, picks) and
        returns a 2-minute OpenAI Realtime client secret for a browser WebRTC call. The permanent
        provider key never leaves the server. Facts and itinerary changes during the call go
        through the `ask_wanees_engine` tool, which calls this assistant endpoint with
        `channel = call`. No audio is stored. Rate limit: 6 calls per 10 minutes per session.
        Returns `VOICE_UNAVAILABLE` (503) when the LLM adapter is off or the provider fails; the
        client then falls back to browser speech.
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Ephemeral call credentials (Cache-Control no-store).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [clientSecret, expiresAt, model, greeting]
                    properties:
                      clientSecret:
                        type: string
                      expiresAt:
                        type: integer
                      model:
                        type: string
                      greeting:
                        type: string
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Live voice is unavailable; use browser speech.
  /api/v1/events/{eventSlug}/assistant/nudges:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Assistant]
      operationId: getAssistantNudges
      summary: Proactive nudges for this visitor right now
      description: |
        Deterministic nudges computed from the visitor's active plan and the event
        clock: `leave_now` / `show_soon` when it is time to walk to the next stop (a longer
        buffer for families and low-walking visitors) and `visit_ending` 20 minutes before the
        visit window ends. Empty while the venue is closed. Each nudge has a stable `id` so
        clients show it once, a sentence for chat or the live call, and an A2UI surface.
        The plan is never changed. Nudges returned here count as delivered for this visit's
        lock-screen subscriptions (`PUT /push`), so the phone does not repeat what the open app showed.
        Rate limit: 20 requests/minute per session.
      security:
        - visitorSession: []
        - visitorCookie: []
      responses:
        '200':
          description: Current nudges (Cache-Control no-store).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [nudges, clock, nextPollAfterMs]
                    properties:
                      nudges:
                        type: array
                        items:
                          type: object
                          required: [id, kind, text, ui]
                          properties:
                            id:
                              type: string
                            kind:
                              type: string
                              enum: [leave_now, show_soon, visit_ending]
                            text:
                              type: string
                            targetId:
                              type: string
                            ui:
                              $ref: '#/components/schemas/A2uiMessages'
                      clock:
                        type: object
                      nextPollAfterMs:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/events/{eventSlug}/push:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Assistant]
      operationId: getPushConfig
      summary: Whether lock-screen nudges are available, and the VAPID key to subscribe with
      responses:
        '200':
          description: Push availability (Cache-Control no-store).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [enabled, publicKey]
                    properties:
                      enabled:
                        type: boolean
                      publicKey:
                        type: string
                        nullable: true
                        description: Base64url VAPID application server key (65-byte P-256 point).
                  meta:
                    $ref: '#/components/schemas/Meta'
    put:
      tags: [Assistant]
      operationId: subscribePush
      summary: Turn on lock-screen nudges for this device and visit
      description: |
        Stores the browser's Web Push subscription after the visitor tapped the opt-in and granted
        notification permission. Scoped to the visit: it expires with the session and is deleted when
        the visit ends. Only endpoints on known browser push services are accepted. `seenNudgeIds`
        lists nudges the open app already showed so they are not repeated on the lock screen.
        Rate limit: 10 requests per 10 minutes per session.
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subscription]
              properties:
                subscription:
                  type: object
                  additionalProperties: false
                  required: [endpoint, keys]
                  properties:
                    endpoint:
                      type: string
                      format: uri
                      maxLength: 1024
                    expirationTime:
                      type: number
                      nullable: true
                    keys:
                      type: object
                      additionalProperties: false
                      required: [p256dh, auth]
                      properties:
                        p256dh:
                          type: string
                        auth:
                          type: string
                openPath:
                  type: string
                  description: Guide path a tapped notification reopens (`/demo` or `/events/{slug}`).
                  default: /demo
                seenNudgeIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
      responses:
        '200':
          description: Subscribed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [subscribed, expiresAt]
                    properties:
                      subscribed:
                        type: boolean
                      expiresAt:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Push is not configured for this deployment (`PUSH_UNAVAILABLE`).
    delete:
      tags: [Assistant]
      operationId: unsubscribePush
      summary: Turn off lock-screen nudges for this device
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [subscribed, removed]
                    properties:
                      subscribed:
                        type: boolean
                      removed:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /api/v1/internal/push/dispatch:
    post:
      tags: [Platform]
      operationId: dispatchPushNudges
      summary: Send due lock-screen nudges (scheduler hook)
      description: |
        Called every minute by an external scheduler with `Authorization: Bearer <WANEES_PUSH_DISPATCH_TOKEN>`.
        Returns 404 when no token is configured. Each nudge id is claimed before it is sent, so this is
        safe alongside the in-process dispatcher (`WANEES_PUSH_DISPATCH_INTERVAL_SECONDS`).
      security:
        - pushDispatchToken: []
      responses:
        '200':
          description: Dispatch summary.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [enabled, checked, sent, removed, failed]
                    properties:
                      enabled:
                        type: boolean
                      checked:
                        type: integer
                      sent:
                        type: integer
                      removed:
                        type: integer
                      failed:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Dispatch token not configured.
  /api/v1/events/{eventSlug}/live:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Live]
      operationId: getLiveState
      summary: Current crowd levels and active updates
      description: |
        Polling contract. Clients should re-poll after `nextPollAfterMs` and treat data older than
        `staleAfterMs` as stale. `revision` is a content hash of the active updates and crowd
        snapshots; it changes whenever the effective live state changes, so it can be used as a
        cache validator and to detect proposal staleness. Ordering: the snapshot is consistent as of
        `capturedAt`; `updates` are newest-first.
      responses:
        '200':
          description: Live state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/LiveState'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Event not found or not published (`EVENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events/{eventSlug}/analytics:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Organizer]
      operationId: getEventAnalytics
      summary: Aggregated event analytics with flow breakdowns (admin app)
      description: |
        Served by the admin app only. Roles: OWNER, ADMIN, OPERATOR, EDITOR, ANALYST, VIEWER of the
        event's organization. Counts only: no session, visitor or device identifier is returned.
        `data.breakdowns` adds flow by zone, by local hour of the venue timezone (default
        `Asia/Riyadh`) and by party type. Inside the breakdowns, any visitor count from 1 to
        `smallCountThreshold - 1` is hidden as `{ count: null, display: "مخفي", suppressed: true }`, and so are
        the smallest other cells of the same column until at least two cells are hidden and their sum
        reaches the threshold, so subtracting visible cells from a total never reveals a small count.
        The other `data` fields are unchanged from earlier releases.
      servers:
        - url: http://127.0.0.1:3200
          description: Local admin app.
      security:
        - organizerCookie: []
        - adminToken: []
      parameters:
        - name: since
          in: query
          required: false
          description: Window start (ISO-8601). Defaults to 24 hours ago; an invalid value falls back to the default.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Aggregates for the window.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/EventAnalytics'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The organizer has no role on this event (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found in the organizer's organization (`EVENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Telemetry]
      operationId: recordAnalyticsEvent
      summary: Record one product metric
      description: |
        Fire-and-forget telemetry. Events are bucketed into 5-minute windows server-side.
        `zoneKey`/`activityKey` are stable catalog keys and are validated against the session's
        catalog version. Rate limit: **60 requests/minute** per session.
      security:
        - visitorSession: []
        - visitorCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventRequest'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [accepted, id, bucketStart]
                    properties:
                      accepted:
                        type: boolean
                        const: true
                      id:
                        type: string
                      bucketStart:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionTokenRequired'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: Unknown zone or activity key (`ZONE_NOT_FOUND`, `ACTIVITY_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/events/{eventSlug}/status:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    patch:
      tags: [Organizer]
      operationId: changeEventStatus
      summary: Move an event along its lifecycle (admin app)
      description: |
        Served by the admin app only. Roles: OWNER or ADMIN. Same-origin requests only; rate limit
        **20 requests/minute**. Optional `Idempotency-Key` header (scoped to the event).

        Allowed transitions (`admin/lib/event-lifecycle.ts`):

        | from | to |
        |---|---|
        | DRAFT | PUBLISHED (needs a published catalog version), ARCHIVED |
        | PUBLISHED | LIVE (needs a published catalog version), DRAFT, ARCHIVED |
        | LIVE | COMPLETED |
        | COMPLETED | ARCHIVED |
        | ARCHIVED | DRAFT (restore) |

        `ARCHIVED` and `COMPLETED` require `confirm: true`. `from` must equal the current status;
        the update is applied only while it still does. Visitors are served only `PUBLISHED` and
        `LIVE` events. Every change writes an `AuditLog` row (`event.status_change`) with the
        before and after status.

        Error codes: `INVALID_REQUEST` (400), `UNAUTHORIZED` (401), `FORBIDDEN` (403),
        `EVENT_NOT_FOUND` (404), `EVENT_STATUS_CHANGED`, `EVENT_TRANSITION_NOT_ALLOWED`,
        `CATALOG_NOT_PUBLISHED`, `IDEMPOTENCY_KEY_REUSED`, `IDEMPOTENCY_REQUEST_IN_PROGRESS` (409),
        `CONFIRMATION_REQUIRED` (428), `RATE_LIMITED` (429).
      servers:
        - url: http://127.0.0.1:3200
          description: Local admin app.
      security:
        - organizerCookie: []
        - adminToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 1–200 printable ASCII characters, no spaces. Replays the stored response for 24 hours.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventStatusChangeRequest'
      responses:
        '200':
          description: Status changed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/EventStatusChange'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not same-origin, or the organizer is not OWNER/ADMIN (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found in the organizer's organization (`EVENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale `from`, transition not allowed, no published catalog, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: 'Archive or finish without `confirm: true` (`CONFIRMATION_REQUIRED`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/events/{eventSlug}/map:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Catalog]
      operationId: getVenueMap
      summary: Zones and map geometry
      description: |
        Public, unauthenticated. Falls back to the JSON fixture only for the demo slugs
        `boulevard-world-demo` and `boulevard_world`, and then reports
        `meta.persistence = "json-fallback"` with a `meta.warning`.
      responses:
        '200':
          description: Map payload.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/MapResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Event not found and not a demo slug (`EVENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/events/{eventSlug}/weather:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Catalog]
      operationId: getVenueWeather
      summary: Current weather at the venue
      description: |
        Public, unauthenticated. Live from Open-Meteo (cached ten minutes). When the provider is
        unreachable the deterministic estimate answers with `weather.live = false`, so a client never
        presents an estimate as a live reading.
      responses:
        '200':
          description: Weather reading.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [weather]
                    properties:
                      weather:
                        type: object
                        required: [temperatureCelsius, condition, impactHint, source, live, summaryAr]
                        properties:
                          temperatureCelsius: { type: number }
                          condition: { type: string }
                          impactHint: { type: string }
                          source: { type: string }
                          live: { type: boolean }
                          summaryAr: { type: string }
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: The event has no known coordinates (`WEATHER_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events/{eventSlug}:
    parameters:
      - $ref: '#/components/parameters/EventSlug'
    get:
      tags: [Catalog]
      operationId: getLegacyEventCatalog
      deprecated: true
      summary: Full published catalog (legacy)
      description: |
        Legacy bootstrap endpoint used by the first demo build. Prefer
        `/api/v1/events/{eventSlug}/map` plus `/api/v1/events/{eventSlug}/live`.
        Returns the raw published catalog including activities, locations and route graph.
      responses:
        '200':
          description: Event catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/EventCatalog'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Event not found and not a demo slug.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/zones:
    get:
      tags: [Catalog]
      operationId: getLegacyZones
      deprecated: true
      summary: Zone list from the active JSON catalog (legacy)
      description: Unauthenticated demo endpoint. Prefer `/api/v1/events/{eventSlug}/map`.
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items:
                      $ref: '#/components/schemas/ZoneSummary'

  /api/health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: Liveness and database readiness
      description: |
        Returns 200 when the database is configured and reachable, 503 otherwise.
        Intended for container probes and uptime checks. No envelope, no auth.
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Degraded (database unreachable or not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/ops:
    get:
      tags: [Platform]
      operationId: getOpsMetrics
      deprecated: true
      summary: Demo operations dashboard metrics (legacy)
      description: |
        In-memory, single-process demo metrics computed from live visitor sessions.
        Values are in-memory demo metrics and must not be treated as production SLO data.
        `offline` is the live-source signal; session counts use the ADR-005 names.
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsMetrics'

  /api/tick:
    get:
      tags: [Platform]
      operationId: getCrowdTick
      deprecated: true
      summary: Demo crowd-alert poller (legacy)
      description: |
        Looks at the next two stops of an in-memory session and suggests a substitute when the
        projected crowd exceeds the venue threshold. `alert` is `null` when there is nothing to say.
      parameters:
        - name: session
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Alert or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrowdTick'

  /api/admin/broadcast:
    get:
      tags: [Platform]
      operationId: getAdminBroadcast
      deprecated: true
      summary: Admin dashboard data (legacy)
      security:
        - adminToken: []
      responses:
        '200':
          description: Admin metrics and session list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Platform]
      operationId: postAdminCrowdEvents
      deprecated: true
      summary: Apply crowd events to all in-memory sessions (legacy)
      description: |
        Validates zone identifiers before applying. An unknown zone returns 400 rather than 500.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/CrowdEvent'
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [ok, touched]
                properties:
                  ok:
                    type: boolean
                    const: true
                  touched:
                    type: integer
        '400':
          description: Invalid body or unknown zone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    visitorSession:
      type: apiKey
      in: header
      name: x-wanees-session-token
      description: Visitor session token returned by `POST /session`. `Authorization Bearer <token>` is also accepted.
    visitorCookie:
      type: apiKey
      in: cookie
      name: wanees_visitor_session
      description: HttpOnly cookie set by `POST /session` when browser cookie sessions are enabled.
    pushDispatchToken:
      type: http
      scheme: bearer
      description: Scheduler secret compared against `WANEES_PUSH_DISPATCH_TOKEN` (at least 24 characters).
    organizerCookie:
      type: apiKey
      in: cookie
      name: wanees_organizer_session
      description: HttpOnly organizer session cookie set by the admin app login. `x-wanees-admin-session` or Bearer are also accepted.
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
      description: Shared admin secret compared against `ADMIN_TOKEN`.
  parameters:
    EventSlug:
      name: eventSlug
      in: path
      required: true
      description: Stable event slug, for example `boulevard-world-demo`.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key that makes a write replay-safe. 1–200 printable ASCII characters, no
        spaces. Scoped to the visitor session: the same key with the same body replays the original
        response, the same key with a different body returns `409 IDEMPOTENCY_KEY_REUSED`, and a key
        that is still being processed returns `409 IDEMPOTENCY_REQUEST_IN_PROGRESS` with `retry-after`.
        Stored responses expire after 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    RequestId:
      description: Correlation id echoed in `meta.requestId`.
      schema:
        type: string
    IdempotencyReplay:
      description: Present and `true` when the body is a replay of the response stored for this `Idempotency-Key`.
      schema:
        type: string
        const: "true"
  responses:
    BadRequest:
      description: Body failed zod validation (`INVALID_REQUEST`); `details` carries the flattened issue tree.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or wrong credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SessionTokenRequired:
      description: No visitor token in header, bearer or cookie (`SESSION_TOKEN_REQUIRED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SessionNotFound:
      description: Session missing, deleted or expired (`SESSION_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded (`RATE_LIMITED`). `retry-after` is set in seconds.
      headers:
        retry-after:
          description: Seconds until the window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Database unavailable or event not published (`DATABASE_UNAVAILABLE`, `EVENT_UNAVAILABLE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    VisitorPosition:
      type: object
      additionalProperties: false
      description: >-
        Where the visitor is. The phone snaps its GPS fix to the nearest walkway node and sends only
        that node id; a kiosk sends its own node. GPS is trusted for 2 minutes and up to 150 m accuracy,
        a spoken position for 20 minutes. Coordinates are never accepted.
      required: [nodeId, capturedAt, source]
      properties:
        nodeId: { type: string, minLength: 1, maxLength: 120 }
        accuracyM: { type: number, minimum: 0, maximum: 5000 }
        capturedAt: { type: string, format: date-time }
        source: { type: string, enum: [gps, kiosk, spoken] }
    PositionRejection:
      type: string
      enum: [unknown_node, closed_node, stale, too_coarse, future]
      description: Why a sent position was not used. The answer then counts from the next best origin.
    Meta:
      type: object
      required: [contractVersion, requestId]
      properties:
        contractVersion:
          type: string
          const: v1
        requestId:
          type: string
        persistence:
          type: string
          enum: [postgresql, json-fallback]
        catalogVersionId:
          type: string
        features:
          $ref: '#/components/schemas/PublicFeatureFlags'
        changed:
          type: boolean
        warning:
          type: string
        retention:
          type: string
        simulated:
          type: boolean
        sources:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
      additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ApiErrorCode'
            message:
              type: string
            details:
              description: Validation details or other machine-readable context.
        meta:
          $ref: '#/components/schemas/Meta'

    ApiErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - EVENT_NOT_FOUND
        - EVENT_UNAVAILABLE
        - DATABASE_UNAVAILABLE
        - SESSION_TOKEN_REQUIRED
        - SESSION_NOT_FOUND
        - ITINERARY_NOT_FOUND
        - CATALOG_VERSION_UNAVAILABLE
        - CATALOG_INCOMPLETE
        - PROPOSAL_REQUIRED
        - PROPOSAL_NOT_FOUND
        - PROPOSAL_STALE
        - RATE_LIMITED
        - IDEMPOTENCY_KEY_INVALID
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_REQUEST_IN_PROGRESS
        - UNAUTHORIZED
        - FORBIDDEN
        - INTERNAL_ERROR
        - ZONE_NOT_FOUND
        - ACTIVITY_NOT_FOUND
        - PUSH_UNAVAILABLE
        - PUSH_ENDPOINT_NOT_ALLOWED
        - VISITOR_REGISTRATION_REQUIRED
        - VISITOR_CONSENT_REQUIRED
        - VISITOR_PHONE_INVALID
        - OTP_CHALLENGE_NOT_FOUND
        - OTP_CHALLENGE_EXPIRED
        - OTP_CODE_INVALID
        - OTP_TOO_MANY_ATTEMPTS
        - SMS_PROVIDER_UNAVAILABLE

    PublicFeatureFlags:
      type: object
      properties:
        browserCookieSession:
          type: boolean
        proposalConcurrency:
          type: boolean
        map2dV2:
          type: boolean
        llmAdapter:
          type: boolean
        visitorRegistration:
          type: boolean

    VisitorProfileSummary:
      type: object
      required: [name, maskedPhone, visitCount, hasPreferences, lastSeenAt]
      properties:
        name: { type: string }
        maskedPhone: { type: string, example: '+9665•••••678' }
        visitCount: { type: integer }
        hasPreferences: { type: boolean }
        lastSeenAt: { type: string, format: date-time }

    Locale:
      type: string
      enum: [ar-SA, en]

    Preferences:
      type: object
      description: Visitor preferences. Unknown keys are rejected (`strict` schema).
      additionalProperties: false
      properties:
        companions:
          type: string
          minLength: 1
          maxLength: 40
        partySize:
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: Whole group including children. Activity prices are per head; `budgetMaxCents` is for the group.
        youngestChildAge:
          type: integer
          minimum: 0
          maximum: 17
          nullable: true
          description: Age of the youngest child. Activities whose minimum age exceeds it are skipped; when omitted for a family, every age-limited activity is skipped.
        mood:
          type: string
          minLength: 1
          maxLength: 40
        interests:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 40
        budgetMaxCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          nullable: true
        availableMinutes:
          type: integer
          minimum: 10
          maximum: 1440
          nullable: true
        walkingTolerance:
          type: string
          minLength: 1
          maxLength: 20
        startPointId:
          type: string
          minLength: 1
          maxLength: 120
        optInPersist:
          type: boolean

    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
          default: ar-SA
        clientType:
          type: string
          enum: [web, native, kiosk]
          default: web
          description: |
            `kiosk` is a venue screen (audit 5.2). It must send its device token in `x-wanees-kiosk-token`
            (401 KIOSK_TOKEN_INVALID otherwise). A kiosk visit is anonymous (bearer token, no guest or registered
            memory, no registration), ends after 60 seconds without a request, and counts every walking answer
            from the kiosk's node.
        entryPoint:
          type: string
          minLength: 1
          maxLength: 120
        consentState:
          type: object
          additionalProperties: true
        preferences:
          $ref: '#/components/schemas/Preferences'

    CreateSessionResponse:
      type: object
      required: [sessionId, authMode, eventSlug, catalogVersionId, expiresAt, preferences, clock]
      properties:
        sessionId:
          type: string
        token:
          type: string
          description: Present only when `authMode` is `bearer`.
        authMode:
          type: string
          enum: [bearer, cookie]
        eventSlug:
          type: string
        catalogVersionId:
          type: string
        expiresAt:
          type: string
          format: date-time
        preferences:
          oneOf:
            - $ref: '#/components/schemas/Preferences'
            - type: 'null'
        clock:
          $ref: '#/components/schemas/Clock'
        personalized:
          type: boolean
        registered:
          type: boolean
          description: True when the visit belongs to a registered visitor.
        remembered:
          type: boolean
          description: A guest who ticked «تذكّرني» before; the new plan skips activities from earlier visits.
        visitCount:
          type: integer
          minimum: 1
          description: Present when remembered. This visit included.

    Clock:
      type: object
      required: [nowMinute, actualMinute, timezone, isWithinEvent, isOpen, source]
      properties:
        nowMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minute the engine treats as now (clamped to venue opening hours).
        actualMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Real local minute in the venue timezone.
        timezone:
          type: string
          examples: [Asia/Riyadh]
        isWithinEvent:
          type: boolean
        isOpen:
          type: boolean
        source:
          type: string
          enum: [server_clock, event_opening, event_window, demo_clock]

    CreateItineraryRequest:
      type: object
      additionalProperties: false
      properties:
        preferences:
          $ref: '#/components/schemas/Preferences'
        generatedReason:
          type: string
          minLength: 1
          maxLength: 160

    Profile:
      type: object
      description: Engine-normalised visitor profile. Derived server-side from preferences.
      properties:
        mood:
          type: string
        budget:
          type: number
          nullable: true
        companions_kids:
          type: boolean
        companions_adults:
          type: integer
        party_size:
          type: integer
          nullable: true
        youngest_child_age:
          type: integer
          nullable: true
        interests:
          type: array
          items:
            type: string
        start_min:
          type: integer
        duration_min:
          type: integer
        start_zone:
          type: string
        must_include:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string

    Stop:
      type: object
      required: [act_id, zone, start, end, walk_min, wait_min, price, name, note]
      properties:
        act_id:
          type: string
          description: Stable catalog key of the activity.
        zone:
          type: string
          description: Stable catalog key of the zone.
        start:
          type: integer
          description: Minutes after local midnight.
        end:
          type: integer
        walk_min:
          type: integer
        wait_min:
          type: integer
        price:
          type: number
          description: Whole SAR.
        name:
          type: string
        note:
          type: string
          description: Why the stop was placed or changed (Arabic, user-facing).

    Itinerary:
      type: object
      required: [stops, unfulfilled, explanations, score, total_cost]
      properties:
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        unfulfilled:
          type: array
          items:
            type: string
        explanations:
          type: array
          items:
            type: string
        score:
          type: number
        total_cost:
          type: number
          description: Whole SAR.

    ItineraryItem:
      type: object
      description: Persisted stop row (Prisma `ItineraryItem` with its `activity`).
      properties:
        id:
          type: string
        itineraryId:
          type: string
        activityId:
          type: string
        sequence:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        walkMin:
          type: integer
        waitMin:
          type: integer
        score:
          type: number
        reasonCodes:
          type: array
          items:
            type: string
        sourceRefs:
          type: array
          items:
            type: string
        activity:
          type: object
          additionalProperties: true
      additionalProperties: true

    ItineraryResponse:
      type: object
      required: [itineraryId, sessionId, profile, itinerary, itineraryItems, nowText, clock]
      properties:
        itineraryId:
          type: string
          nullable: true
        sessionId:
          type: string
        catalogVersionId:
          type: string
        profile:
          $ref: '#/components/schemas/Profile'
        itinerary:
          oneOf:
            - $ref: '#/components/schemas/Itinerary'
            - type: 'null'
        itineraryItems:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryItem'
        nowText:
          type: string
          description: Human-readable clock time, Arabic.
          examples: ['5:00 م']
        clock:
          $ref: '#/components/schemas/Clock'

    ReplanRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        nowMinute:
          type: integer
          minimum: 0
          maximum: 1440
          description: Only honoured when `WANEES_ALLOW_CLOCK_OVERRIDE=true`.
        reason:
          type: string
          minLength: 1
          maxLength: 160
        decision:
          type: string
          enum: [preview, accept, keep_current]
          default: preview
        proposalId:
          type: string
          maxLength: 100
        baseItineraryId:
          type: string
          maxLength: 100
        baseLiveRevision:
          type: string
          maxLength: 160

    ReplanDiff:
      type: object
      required: [removed, added, moved, changed]
      properties:
        removed:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              zone:
                type: string
        added:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              zone:
                type: string
              start:
                type: integer
              end:
                type: integer
        moved:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              from:
                type: object
                additionalProperties: true
              to:
                type: object
                additionalProperties: true
        changed:
          type: boolean

    ReplanResponse:
      type: object
      required: [mode, itineraryId, itinerary, diff, nowMinute, clock]
      properties:
        mode:
          type: string
          enum: [APPLIED, PROPOSED, DISMISSED, NO_CHANGE]
        itineraryId:
          type: string
        proposalId:
          type: string
          nullable: true
        itinerary:
          $ref: '#/components/schemas/Itinerary'
        candidateItinerary:
          oneOf:
            - $ref: '#/components/schemas/Itinerary'
            - type: 'null'
        diff:
          $ref: '#/components/schemas/ReplanDiff'
        incentive:
          oneOf:
            - $ref: '#/components/schemas/IncentiveDisplay'
            - type: 'null'
        nowMinute:
          type: integer
        clock:
          $ref: '#/components/schemas/Clock'
        proposal:
          type: object
          nullable: true
          properties:
            baseItineraryId:
              type: string
              nullable: true
            baseLiveRevision:
              type: string
              nullable: true
            proposalExpiresAt:
              type: string
              format: date-time
              nullable: true
        live:
          type: object
          properties:
            liveRevision:
              type: string
            eventUpdateIds:
              type: array
              items:
                type: string
            snapshotCount:
              type: integer

    IncentiveKind:
      type: string
      enum: [FREE_ITEM, DISCOUNT, PRIORITY_ENTRY, FREE_ACTIVITY, CREDIT]
    IncentiveTrigger:
      type: string
      enum: [CLOSURE, DELAY, SCHEDULE_CHANGE, CROWD_OVERRIDE]
    IncentiveDisplay:
      type: object
      required: [id, kind, titleAr, valueLabelAr, reasonAr]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/IncentiveKind'
        titleAr:
          type: string
        valueLabelAr:
          type: string
          description: The human-visible value, e.g. "قهوة مجانية".
        reasonAr:
          type: string
          description: The human-visible reason, e.g. "الازدحام في هذه المنطقة".
        locationLabelAr:
          type: string
          nullable: true
        redirectZoneKey:
          type: string
          nullable: true
    A2uiActionMessage:
      type: object
      description: |
        A2UI v1.0 renderer-to-agent action (https://a2ui.org). `add_to_plan`, `choose` and `shorten_plan` are
        mapped server-side to a deterministic visitor message; `get_directions`, `show_on_map`
        and `respond_to_proposal` are handled by the client and are rejected here with
        `A2UI_ACTION_UNSUPPORTED`.
      required: [version, action]
      additionalProperties: false
      properties:
        version:
          type: string
          enum: ['1.0']
        action:
          type: object
          additionalProperties: false
          required: [name, surfaceId, sourceComponentId, timestamp, context]
          properties:
            name:
              type: string
              enum: [add_to_plan, choose, shorten_plan, get_directions, show_on_map, respond_to_proposal]
            surfaceId:
              type: string
            sourceComponentId:
              type: string
            timestamp:
              type: string
              format: date-time
            userMessage:
              type: string
              maxLength: 200
            context:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
    A2uiMessages:
      type: array
      description: |
        A2UI v1.0 agent-to-renderer messages (`createSurface` with the data model, then
        `updateComponents`) using the basic catalog subset Column, Row, Card, Text, Button,
        Divider. Built from the engine result, never from model text, and validated before
        sending. Native clients can render it with the official A2UI renderers.
      items:
        type: object
    AssistantResponse:
      type: object
      required: [message, intent, tool, confidence, needsClarification, sources, warnings, clock]
      properties:
        message:
          type: string
        ui:
          oneOf:
            - $ref: '#/components/schemas/A2uiMessages'
            - type: 'null'
        facts:
          type: object
          description: Only present for `channel = call`.
        intent:
          type: string
          enum: [build, search, location, status, crowd, explain, help, shorten, remove, swap, add, chat, faq, profile, schedule, alternatives, rest, unknown]
        tool:
          type: string
          nullable: true
        confidence:
          type: number
        needsClarification:
          type: boolean
        itineraryId:
          type: string
          nullable: true
        itinerary:
          oneOf:
            - $ref: '#/components/schemas/Itinerary'
            - type: 'null'
        proposal:
          type: object
          nullable: true
          required: [id, candidate, baseItineraryId, baseLiveRevision, proposalExpiresAt, diff]
          properties:
            id:
              type: string
            candidate:
              $ref: '#/components/schemas/Itinerary'
            baseItineraryId:
              type: string
            baseLiveRevision:
              type: string
              description: "Live event revision at the time the proposal was generated."
            proposalExpiresAt:
              type: string
              format: date-time
              nullable: true
            diff:
              $ref: '#/components/schemas/ReplanDiff'
        next:
          type: object
          nullable: true
          additionalProperties: true
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        handoff:
          type: object
          nullable: true
          properties:
            id:
              type: string
            status:
              type: string
              enum: [OPEN]
        clock:
          $ref: '#/components/schemas/Clock'
        position:
          type: object
          nullable: true
          description: Where walking minutes were counted from, when the visitor's position was known.
          properties:
            zone: { type: string }
            source: { type: string, enum: [gps, kiosk, spoken] }
        positionRejected:
          $ref: '#/components/schemas/PositionRejection'
        linked:
          type: object
          description: Present when the answer came from a linked phone visit (read-only).
          properties:
            scope: { type: string, enum: [read] }
        understanding:
          type: object
          description: >-
            What the assistant understood from the conversation (no survey). `language` is the reply
            language (Saudi Arabic by default; it switches only on a full message in another language).
            `assumptions` are the defaults a freshly built plan used, shown as chips; each chip's
            `message` is the sentence the app types to correct it. `question` is at most one
            follow-up, asked only when its answer changes safety or the plan.
          required: [language, assumptions, question]
          properties:
            language:
              type: string
              enum: [ar, en, fr, ur]
            assumptions:
              type: array
              items:
                type: object
                required: [key, label, message]
                properties:
                  key:
                    type: string
                    enum: [time, safety, budget, party]
                  label:
                    type: string
                  message:
                    type: string
            question:
              type: string
              nullable: true

    ConversationTurn:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        redactedContent:
          type: string
        createdAt:
          type: string
          format: date-time

    LiveState:
      type: object
      required: [event, catalogVersionId, capturedAt, clock, revision, nextPollAfterMs, staleAfterMs, crowd, updates]
      properties:
        event:
          type: object
          required: [id, slug, name]
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
        catalogVersionId:
          type: string
        capturedAt:
          type: string
          format: date-time
        clock:
          $ref: '#/components/schemas/Clock'
        revision:
          type: string
          description: Content hash (20 hex chars) of active updates and crowd snapshots.
        nextPollAfterMs:
          type: integer
          examples: [10000]
        staleAfterMs:
          type: integer
          examples: [45000]
        crowd:
          type: array
          items:
            $ref: '#/components/schemas/CrowdSnapshot'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/EventUpdate'

    CrowdSnapshot:
      type: object
      required: [zone, zoneName, level, source, confidence, observedAt]
      properties:
        zone:
          type: string
        zoneName:
          type: string
        level:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          examples: [sensor, manual, simulated]
        confidence:
          type: number
        observation:
          description: Operator observation associated with this snapshot, if available.
          type: [object, 'null']
          properties:
            measurement: { enum: [counted, estimated] }
            occupiedPeople: { type: integer, minimum: 0 }
            capacity: { type: integer, minimum: 1 }
            waitMinutes: { type: [integer, 'null'], minimum: 0 }
        observedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    EventUpdate:
      type: object
      required: [id, updateType, targetType, payload, createdAt]
      properties:
        id:
          type: string
        updateType:
          type: string
          enum: [CLOSURE, DELAY, SCHEDULE_CHANGE, CROWD_OVERRIDE, CONTENT_CORRECTION]
        targetType:
          type: string
          enum: [event, zone, activity]
        targetId:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MapResponse:
      type: object
      required: [eventSlug, catalogVersionId, demoNavigation, navigation, zones, locations, routeGraph]
      properties:
        eventSlug:
          type: string
        catalogVersionId:
          type: string
        demoNavigation:
          type: boolean
          description: True when the venue's live guidance is off (Venue.liveGuidance); clients then offer directions and a simulated walk only.
        navigation:
          $ref: '#/components/schemas/VenueNavigation'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneSummary'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        routeGraph:
          oneOf:
            - $ref: '#/components/schemas/RouteGraph'
            - type: 'null'

    VenueNavigation:
      type: object
      description: Venue navigation settings set by the organizer. GPS is converted to plan coordinates on the device with this calibration; only snapped route-node ids leave the device.
      required: [liveGuidance, accuracy, simulation, calibration]
      properties:
        liveGuidance:
          type: boolean
          description: The phone may guide the visitor from real GPS.
        accuracy:
          type: string
          enum: [surveyed, approximate]
          description: Approximate guidance tells the visitor to follow the venue signs too.
        simulation:
          type: boolean
          description: Staff and demo location simulation (?gps=simulate) is allowed.
        calibration:
          oneOf:
            - type: 'null'
            - type: object
              required: [anchorLat, anchorLng, metersPerUnit, rotationDeg]
              properties:
                anchorLat: { type: number, minimum: -90, maximum: 90 }
                anchorLng: { type: number, minimum: -180, maximum: 180 }
                metersPerUnit: { type: number, exclusiveMinimum: 0, maximum: 100 }
                rotationDeg: { type: number, minimum: -180, maximum: 180 }

    ZoneSummary:
      type: object
      required: [id, name, x, y]
      properties:
        id:
          type: string
        name:
          type: string
        x:
          type: number
        y:
          type: number

    Zone:
      allOf:
        - $ref: '#/components/schemas/ZoneSummary'
        - type: object
          properties:
            popularity:
              type: number

    Location:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [ENTRANCE, ZONE, ACTIVITY, LANDMARK, SERVICE]
        zone:
          type: string
        x:
          type: number
        y:
          type: number
        accessible:
          type: boolean
        status:
          type: string
        description:
          type: string
        aliases:
          type: array
          items:
            type: string
        sourceRef:
          type: string

    RouteGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              distanceM:
                type: number
              walkMin:
                type: number
              accessible:
                type: boolean
              status:
                type: string

    Activity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        name_en:
          type: string
        zone:
          type: string
        type:
          type: string
        duration_min:
          type: integer
        price:
          type: number
        family:
          type: boolean
        min_age:
          type: integer
        interests:
          type: array
          items:
            type: string
        moods:
          type: array
          items:
            type: string
        popularity:
          type: number
        schedule:
          oneOf:
            - type: object
              required: [type, slots]
              properties:
                type:
                  type: string
                  const: slots
                slots:
                  type: array
                  items:
                    type: integer
            - type: object
              required: [type, from, to]
              properties:
                type:
                  type: string
                  const: continuous
                from:
                  type: integer
                to:
                  type: integer

    EventCatalog:
      type: object
      properties:
        eventId:
          type: string
        eventSlug:
          type: string
        eventName:
          type: string
        eventStatus:
          type: string
        eventStartsAt:
          type: string
          format: date-time
        eventEndsAt:
          type: string
          format: date-time
        venueTimezone:
          type: string
        catalogVersionId:
          type: string
        catalog:
          $ref: '#/components/schemas/Catalog'

    Catalog:
      type: object
      required: [meta, site, zones, activities]
      properties:
        meta:
          type: object
          properties:
            source:
              type: string
            note:
              type: string
            currency:
              type: string
        site:
          type: object
          properties:
            name:
              type: string
            walking_speed_m_per_min:
              type: number
            min_walk_min:
              type: number
            opening:
              type: object
              properties:
                from:
                  type: integer
                to:
                  type: integer
            crowd_threshold:
              type: number
            base_crowd_curve:
              type: object
              additionalProperties:
                type: number
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        routeGraph:
          oneOf:
            - $ref: '#/components/schemas/RouteGraph'
            - type: 'null'

    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, LIVE, COMPLETED, ARCHIVED]
    EventStatusChangeRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: '#/components/schemas/EventStatus'
        to:
          $ref: '#/components/schemas/EventStatus'
        confirm:
          type: boolean
          description: 'Must be `true` when `to` is `ARCHIVED` or `COMPLETED`.'
        reason:
          type: string
          maxLength: 300
          description: Optional note stored in the audit log.
    EventStatusChange:
      type: object
      required: [slug, previousStatus, status, changedAt, visibleToVisitors, nextActions]
      properties:
        slug:
          type: string
        previousStatus:
          $ref: '#/components/schemas/EventStatus'
        status:
          $ref: '#/components/schemas/EventStatus'
        changedAt:
          type: string
          format: date-time
        visibleToVisitors:
          type: boolean
        nextActions:
          type: array
          items:
            type: object
            required: [to, label, requiresConfirmation, blockedReason]
            properties:
              to:
                $ref: '#/components/schemas/EventStatus'
              label:
                type: string
                description: Arabic button label.
              requiresConfirmation:
                type: boolean
              blockedReason:
                type: [string, 'null']
    SuppressedCount:
      type: object
      description: A visitor count. Values from 1 to the threshold minus one are withheld.
      required: [count, display, suppressed]
      properties:
        count:
          type: [integer, 'null']
          minimum: 0
        display:
          type: string
          examples: ['12', '0', 'مخفي']
        suppressed:
          type: boolean
    AnalyticsBreakdowns:
      type: object
      required: [timezone, smallCountThreshold, byZone, byHour, byPartyType]
      properties:
        timezone:
          type: string
          description: IANA timezone of the venue used for `byHour` (default `Asia/Riyadh`).
        smallCountThreshold:
          type: integer
          const: 5
        byZone:
          type: array
          description: Published zones (plus zones from older catalog versions seen in the data), busiest first by planned stops.
          items:
            type: object
            required: [id, name, plannedStops, presentNow, interactions, avgCrowdLevel]
            properties:
              id:
                type: string
                description: Zone stable key.
              name:
                type: string
              plannedStops:
                $ref: '#/components/schemas/SuppressedCount'
              presentNow:
                $ref: '#/components/schemas/SuppressedCount'
              interactions:
                $ref: '#/components/schemas/SuppressedCount'
              avgCrowdLevel:
                type: [number, 'null']
                minimum: 0
                maximum: 1
        byHour:
          type: array
          description: 24 rows, one per local hour, starting at the local hour of the window start.
          items:
            type: object
            required: [hour, label, sessions, itineraries, interactions]
            properties:
              hour:
                type: integer
                minimum: 0
                maximum: 23
              label:
                type: string
                examples: ['16:00']
              sessions:
                $ref: '#/components/schemas/SuppressedCount'
              itineraries:
                $ref: '#/components/schemas/SuppressedCount'
              interactions:
                $ref: '#/components/schemas/SuppressedCount'
        byPartyType:
          type: array
          items:
            type: object
            required: [type, label, sessions, avgPartySize]
            properties:
              type:
                type: string
                enum: [solo, couple, family, friends, other, unspecified]
              label:
                type: string
              sessions:
                $ref: '#/components/schemas/SuppressedCount'
              avgPartySize:
                type: [number, 'null']
                description: Withheld (null) when the bucket is suppressed or fewer than five visitors gave a size.
    EventAnalytics:
      type: object
      required: [window, totals, metrics, byZone, byActivity, assistant, breakdowns]
      properties:
        window:
          type: object
          required: [since, until]
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
        totals:
          type: object
          additionalProperties:
            type: integer
        metrics:
          type: array
          items:
            type: object
            required: [metricName, count, value, lastBucket]
            properties:
              metricName: { type: string }
              count: { type: integer }
              value: { type: number }
              lastBucket: { type: string, format: date-time }
        byZone:
          type: array
          description: Analytics events per published zone (earlier shape, unchanged).
          items:
            type: object
            additionalProperties: true
        byActivity:
          type: array
          items:
            type: object
            additionalProperties: true
        assistant:
          type: array
          items:
            type: object
            required: [intent, count, avgLatencyMs, sourceCount]
            properties:
              intent: { type: string }
              count: { type: integer }
              avgLatencyMs: { type: integer }
              sourceCount: { type: integer }
        breakdowns:
          $ref: '#/components/schemas/AnalyticsBreakdowns'

    AnalyticsEventRequest:
      type: object
      additionalProperties: false
      required: [metricName]
      properties:
        metricName:
          type: string
          enum:
            - session_started
            - itinerary_created
            - assistant_message
            - activity_viewed
            - activity_selected
            - replan_requested
            - replan_applied
            - replan_proposed
            - replan_dismissed
            - crowd_warning_seen
            - time_to_plan_seconds
            - update_delivery_seconds
            - visit_rating
        metricValue:
          type: number
          minimum: 0
          maximum: 1000000
          default: 1
          description: For `visit_rating`, a whole number from 1 to 5. Ratings are stored only as anonymous aggregates, without a session identifier.
        zoneKey:
          type: string
          minLength: 1
          maxLength: 120
        activityKey:
          type: string
          minLength: 1
          maxLength: 120

    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          examples: [wanees-visitor-web, wanees-admin-web]
        timestamp:
          type: string
          format: date-time

    OpsMetrics:
      type: object
      properties:
        offline:
          type: boolean
        liveSessions:
          type: integer
        catalogSeeded:
          type: integer
        planned_stops_count:
          type: integer
        diverted_planned_stops:
          type: integer
        simulated_load_balance_pct:
          type: integer
        heuristic_peak_reduction_score_pct:
          type: number
        zones:
          type: array
          items:
            type: object
            properties:
              zone:
                type: string
              name:
                type: string
              planned_stops:
                type: integer
              simulated_crowd_pct:
                type: integer
              saturated:
                type: boolean
        now_hour:
          type: integer

    CrowdEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [crowd_spike, delay, cancel, user_skip, user_add, user_shorten, swap]
        zone:
          type: string
        level:
          type: number
        until_hour:
          type: integer
        activity:
          type: string
        minutes:
          type: integer
        replacement:
          type: string

    CrowdTick:
      type: object
      required: [alert]
      properties:
        alert:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                stop_act:
                  type: string
                stop_name:
                  type: string
                zone:
                  type: string
                level:
                  type: number
                suggestion:
                  type: object
                  additionalProperties: true
                text:
                  type: string
